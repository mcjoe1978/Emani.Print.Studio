function render(){
 const d=designs[index],product=el('product').value,color=el('color').value;
 const ctx=el('canvas').getContext('2d');ctx.clearRect(0,0,640,600);
 const column=['Tricou','Hanorac','Sacoșă'].indexOf(product);
 if(photo.naturalWidth)ctx.drawImage(photo,column*512,color==='Alb'?512:0,512,512,0,0,512,512);
 ctx.save();const size=column===1?1.06:1.52;
 ctx.translate(256-50*size,[142,177,225][column]);ctx.scale(size,size);
 const palette=d.palette||[d.ink,'#55bc8a','#9d77c7'];
 const gradient=ctx.createLinearGradient(2,8,90,95);palette.forEach((v,i)=>gradient.addColorStop(i/(palette.length-1),v));
 ctx.strokeStyle=gradient;ctx.lineWidth=2;ctx.lineJoin='round';
 if(d.layers){for(const layer of d.layers){ctx.globalAlpha=layer.opacity;ctx.fillStyle=gradient;ctx.fill(new Path2D(layer.path));}ctx.globalAlpha=1;}
 else{ctx.save();ctx.translate(50,50);ctx.lineWidth=.85;for(let i=0;i<36;i++){ctx.globalAlpha=.22+i/80;ctx.rotate(.09);ctx.beginPath();ctx.ellipse(0,0,44-i*.3,12+i*.31,0,0,Math.PI*2);ctx.stroke();}ctx.restore();}
 for(const line of d.lines){ctx.beginPath();line.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke();}
 ctx.fillStyle=color==='Alb'?'#222b25':'#ebf5ea';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText(d.caption,50,118,123);ctx.restore();
 el('title').textContent=d.title;el('material').textContent=product+' · '+color+' · Față';
 el('options').replaceChildren(...designs.map((item,i)=>{const b=document.createElement('button');b.textContent=item.title;b.setAttribute('aria-pressed',String(i===index));b.onclick=()=>{index=i;render();};return b;}));
}
async function post(url,body){const r=await fetch(API_BASE+url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error);return data;}
const config=()=>({brief:el('brief').value.trim(),product:el('product').value,color:el('color').value});
const ready=()=>'Generare prin Puter · necesită internet și folosește creditul contului conectat.';
function reset(){revision++;designs=samples;index=0;el('optionsTitle').textContent='Modele de probă';el('status').textContent=ready();render();}
for(const id of ['product','color','brief'])el(id).addEventListener('input',reset);
el('generate').onclick=async()=>{
 if(!config().brief)return el('brief').focus();
 const version=revision;el('generate').disabled=true;el('status').textContent='Se pregătesc cele trei compoziții…';
 try{if(!window.puter)throw Error('Serviciul AI nu s-a încărcat. Verifică internetul și reîncarcă pagina.');
 if(!puter.auth.isSignedIn())await puter.auth.signIn();
 const result=await puter.ai.chat('Create three genuinely different professional layered print artworks based on this brief: '+JSON.stringify(config())+'. Return only a JSON array of 3 objects. Each has Romanian title, short caption, palette (3 different #RRGGBB hex colors contrasting with fabric), layers (8-16 overlapping closed SVG paths in viewBox 0 0 100 100, with curves, detailed silhouettes and negative space). Each layer has path (SVG d string), opacity (number .18 to 1). Design the subject of the brief.');const raw=result.message?.content??String(result);
 const list=JSON.parse(raw.slice(raw.indexOf('['),raw.lastIndexOf(']')+1));
 if(!Array.isArray(list)||list.length!==3||!list.every(d=>typeof d.title==='string'&&typeof d.caption==='string'&&Array.isArray(d.palette)&&d.palette.length===3&&d.palette.every(c=>/^#[a-f0-9]{6}$/i.test(c))&&Array.isArray(d.layers)&&d.layers.length>1&&d.layers.length<=40&&d.layers.every(l=>typeof l.path==='string'&&l.path.length<16000&&Number.isFinite(l.opacity)&&l.opacity>=0&&l.opacity<=1)))throw Error('Format AI invalid. Reîncearcă.');
 if(version!==revision)return;designs=list.map(d=>({...d,ink:d.palette[0],lines:[]}));index=0;render();el('optionsTitle').textContent='Propuneri AI';el('status').textContent='Alege modelul preferat.';
 }catch(e){if(version===revision)el('status').textContent=e.message||'Generarea a eșuat.'}finally{el('generate').disabled=false;}
};
function downloadQuote(quote){
 const blob=new Blob([JSON.stringify(quote,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download='cerere-emani.json';a.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}
el('quote').onsubmit=async e=>{
 e.preventDefault();
 if(!config().brief)return el('brief').focus();
 const quote={...config(),design:designs[index],email:el('email').value,qty:Number(el('qty').value)};
 const button=e.submitter, receipt=el('receipt');
 if(!API_BASE){
   downloadQuote(quote);
   receipt.textContent='Fișierul cererii a fost pregătit pentru descărcare.';
   if(QUOTE_EMAIL){
     const subject=encodeURIComponent('Cerere de ofertă · Emani Print Store');
     const body=encodeURIComponent('Bună! Aș dori o ofertă pentru '+quote.qty+' buc. · '+quote.product+' · '+quote.color+'\nModel: '+quote.design.title+'\nDescriere: '+quote.brief+'\nE-mail: '+quote.email+'\n\nAtașez fișierul cerere-emani.json.');
     const link=document.createElement('a');
     link.href='mailto:'+QUOTE_EMAIL+'?subject='+subject+'&body='+body;
     link.textContent='Deschide e-mailul și atașează fișierul';
     receipt.append(' ',link);
   }
   return;
 }
 button.disabled=true;receipt.textContent='Se înregistrează…';
 try{const result=await post('/api/quotes',quote);receipt.textContent='Solicitare înregistrată. Referință: '+result.id;}
 catch(error){receipt.textContent='Solicitarea nu a fost confirmată. '+error.message;}
 finally{button.disabled=false;}
};
render();
el('status').textContent=ready();
el('generate').disabled=false;
if(API_BASE){
 el('quote').querySelector('button').textContent='Trimite solicitarea';
 el('quote').querySelector('p').textContent='Trimite atelierului modelul ales și cantitatea dorită.';
 fetch(API_BASE+'/api/status').then(r=>r.json()).then(s=>{
   ai=s.ai===true;el('generate').disabled=!ai;el('status').textContent=ready();
 }).catch(()=>{el('status').textContent='Serverul AI nu răspunde momentan.';});
}
</script><script async src="https://js.puter.com/v2/"></script></body></html>
